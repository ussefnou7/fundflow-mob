name: fundflow_mob
description: "Monetizer mobile client for custody, treasury, extracts, purchasing, inspections and approvals."
publish_to: 'none'

# build-name is the store version (versionName / CFBundleShortVersionString);
# build-number must go up on every upload (versionCode / CFBundleVersion).
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  clock: ^1.1.2
  crypto: ^3.0.7
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  lucide_icons_flutter: ^4.0.1
  image_picker: ^1.2.4
  biometric_storage: ^5.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  url_launcher: ^6.3.3
  # HR (parked/hr) also needs, when it comes back:
  #   geolocator: ^14.0.2
  #   camera: ^0.12.0+2
  #   google_mlkit_face_detection: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/monetizer-icon.png
  remove_alpha_ios: true
  # Android 8+: the M alone on white, so each launcher's mask (circle,
  # squircle) shapes it instead of shrinking the square icon inside a circle.
  # Android 13 tints the same mark for themed icons.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/adaptive-foreground.png
  adaptive_icon_monochrome: assets/branding/adaptive-foreground.png

# The launch screen: the M on white, the same on iOS and every Android.
# Regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash-mark.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash-android12.png
  ios_content_mode: center
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/monetizer-logo.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
